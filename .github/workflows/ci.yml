name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  GITHUB_TOKEN: ${{ secrets.MH4GF_PAT }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: MH4GF/shared-config/.github/composite-actions/setup-pnpm@f2796daf3cd57dcc0a63b5093dfd2eb32bbcc4a5 # main
      - run: pnpm build:contentlayer
      - run: pnpm exec next typegen
      - run: pnpm lint

  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    env:
      # コンポーネントVRT (component-vrt プロジェクト) を有効化する。scripts/vrt.sh と同一 digest の
      # コンテナ内でのみ VRT=1 になるため、コミット済み基準画像と決定的に比較できる
      VRT: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: MH4GF/shared-config/.github/composite-actions/setup-pnpm@f2796daf3cd57dcc0a63b5093dfd2eb32bbcc4a5 # main
      - run: pnpm test:vitest
      # VRT 失敗時の actual / diff 画像を差分レビュー用にアップロードする
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: component-vrt-results
          path: .vitest-attachments/
