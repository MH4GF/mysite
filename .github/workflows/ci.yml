name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  GITHUB_TOKEN: ${{ secrets.MH4GF_PAT }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: MH4GF/shared-config/.github/composite-actions/setup-pnpm@5378bfce550384e1e9a83504ab2a71df28cc6920 # main
      - run: pnpm build:contentlayer
      - run: pnpm exec next typegen
      - run: pnpm lint

  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble@sha256:3bed4b1a12f2338642f3d8cba28e291deef3c66bd4a964bbeb3e57bbff511dbd
    env:
      # コンポーネントVRT (component-vrt プロジェクト) を有効化する。scripts/vrt.sh と同一 digest の
      # コンテナ内でのみ VRT=1 になるため、コミット済み基準画像と決定的に比較できる
      VRT: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: MH4GF/shared-config/.github/composite-actions/setup-pnpm@5378bfce550384e1e9a83504ab2a71df28cc6920 # main
      - run: pnpm test:vitest
      # VRT 失敗時の actual / diff 画像を差分レビュー用にアップロードする
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: component-vrt-results
          path: .vitest-attachments/
