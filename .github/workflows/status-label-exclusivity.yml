name: status label exclusivity

on:
  issues:
    types: [labeled]

# Symphony の GitHub tracker は issue の status:* label を状態の SSoT として読む。
# 1 issue が status:* を 2 つ以上持つと状態が曖昧になるため、label が付いた直後に
# 他の status:* を剥がす。これにより人間は「新しい label を付ける」1 操作だけで
# 状態遷移でき、モバイルからの操作が成立する。
jobs:
  normalize:
    if: startsWith(github.event.label.name, 'status:')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    # 同一 issue へ短時間に 2 回 label が付くと、古い run が自分の KEEP を基準に
    # 新しい label を剥がし、双方が消えて status:* がゼロになる。最新の run だけを
    # 残す。
    concurrency:
      group: status-label-exclusivity-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - name: Remove the other status labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          KEEP: ${{ github.event.label.name }}
        run: |
          set -euo pipefail

          labels_json="$(gh api "repos/${REPO}/issues/${ISSUE}/labels")"

          # cancel-in-progress をすり抜けた古い run への保険。KEEP が既に剥がされて
          # いるなら、この run の基準は古い。何もせず抜ける。
          if ! printf '%s' "${labels_json}" \
            | jq -e --arg keep "${KEEP}" 'any(.[]; .name == $keep)' > /dev/null; then
            echo "skip: ${KEEP} is no longer on the issue"
            exit 0
          fi

          printf '%s' "${labels_json}" \
            | jq -r --arg keep "${KEEP}" \
              '.[].name | select(startswith("status:")) | select(. != $keep)' \
            > stale-labels.txt

          while IFS= read -r label; do
            [ -n "${label}" ] || continue
            encoded="$(jq -rn --arg l "${label}" '$l | @uri')"
            gh api --method DELETE "repos/${REPO}/issues/${ISSUE}/labels/${encoded}"
            echo "removed ${label}"
          done < stale-labels.txt
